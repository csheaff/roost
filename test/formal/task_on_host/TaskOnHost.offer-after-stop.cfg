\* expect: OffersTold
\* Broken: propose_task takes an offer from a stopped task.  Its agent's
\* server answers as `stop` closes its pane, the offer is recorded while the
\* worktree goes, and the record goes with it, unseen.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"offer"}
    Break = "offer_after_stop"
INVARIANT OffersTold
