\* expect: DiscardTold
\* Broken, its discard side: discard_losses counts on the branch of a task
\* whose worktree is going.  Discard the fork, told it loses no commit as
\* its source's branch has it; while its worktree goes, the source is
\* discarded, told the same of the fork.  Both branches go, and you were
\* told of no commit.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"forked"}
    Break = "going_counts"
INVARIANT DiscardTold
