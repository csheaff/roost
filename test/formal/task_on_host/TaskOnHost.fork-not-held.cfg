\* expect: ForkWhole
\* Broken: a fork asks whether its source's worktree is going without the
\* registry lock, and reads it with no hold on it, as before.  A discard
\* starts in between, and the fork reads a worktree Git is removing.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"fork reads"}
    Break = "fork_no_hold"
INVARIANT ForkWhole
