\* expect: StopLeavesNone
\* FINDING in the code as it is: `stop` ends what the pane left running a
\* second after it asks (`end_left_running`), and Git, hung up as it made
\* the task's worktree, may still be removing what it made.  Part of the
\* folder stays, which Git no longer lists: resuming refuses it, and only a
\* discard takes it, counting Git's files as yours.  See
\* verify-task-on-host.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 0
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"unmade", "stop", "slow clean-up"}
    Break = "none"
INVARIANT StopLeavesNone
