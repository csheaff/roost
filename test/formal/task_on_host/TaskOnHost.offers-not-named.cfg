\* expect: OffersTold
\* Broken: a request says nothing of the offers its question named, as
\* before.  Its agent offers a task while you read what a discard loses;
\* you answer, and the offer goes with the task, which nothing named.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"offer", "offer once asked"}
    Break = "offers_not_named"
INVARIANT OffersTold
