\* expect: StartsWhole
\* Broken: a run takes whatever folder is at the worktree's path as made.
\* Resumed after the host restarted as Git made it, the task's agent starts
\* in half a checkout.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 0
    MaxCrashes = 1
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"unmade", "resume"}
    Break = "cut_short_made"
INVARIANT StartsWhole
