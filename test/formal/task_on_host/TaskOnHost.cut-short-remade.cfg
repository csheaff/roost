\* expect: KeptButByDiscard
\* Broken: a run that finds what Git was cut short making forces it away,
\* as a creation cut short is undone, and makes the worktree anew.  The
\* host restarted as Git made it, someone wrote a file there, and resuming
\* the task deletes it.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 1
    MaxRequests = 0
    MaxCrashes = 1
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"unmade", "resume"}
    Break = "cut_short_remade"
INVARIANT KeptButByDiscard
