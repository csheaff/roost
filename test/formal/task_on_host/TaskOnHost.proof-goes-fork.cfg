\* expect: KeptButByDiscard
\* Broken, for a fork: safe_to_delete takes the branch of the worktree its
\* agent made for the other branch that has a fork's start, as before.  The
\* task it was forked from goes, the fork never commits, and retire removes
\* both branches that had its source's commit.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"forked"}
    Break = "proof_goes"
INVARIANT KeptButByDiscard
