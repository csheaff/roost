\* expect: OffersTold
\* Broken: resume starts the agent again while a request removes the task's
\* worktree.  The request named its offers and stopped the agent; resumed,
\* it offers a task, and the record goes with it, unseen.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"offer", "resume"}
    Break = "resume_any_time"
INVARIANT OffersTold
