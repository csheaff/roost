\* expect: DiscardTold
\* Broken: resume starts the agent again while a discard removes the task's
\* worktree.  The discard counted what it would lose and stopped the agent;
\* resumed, it writes a file there, which goes with the worktree, untold.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 1
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"resume"}
    Break = "resume_any_time"
INVARIANT DiscardTold
