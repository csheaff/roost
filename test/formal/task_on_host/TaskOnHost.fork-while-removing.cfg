\* expect: ForkWhole
\* Broken: a fork doesn't ask whether a removal of its source's worktree was
\* cut short (require_not_removing).  A request dies as Git removes it, and
\* the fork reads what is left.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 1
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"fork reads"}
    Break = "fork_any_time"
INVARIANT ForkWhole
