\* expect: OffersTold
\* FINDING in the code as it is: its agent offers a task once you were
\* asked, before the request stops it, as while you read what a discard
\* loses.  The offer goes with the task, and the question never named it.
\* See verify-task-on-host.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"offer", "offer once asked"}
    Break = "none"
INVARIANT OffersTold
