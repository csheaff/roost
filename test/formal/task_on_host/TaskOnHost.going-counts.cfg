\* expect: KeptButByDiscard
\* Broken: safe_to_delete counts on the branch of a task whose worktree is
\* going, and that task's discard on this one's, as before.  A fork that
\* never committed and the task it was made from, with a commit only their
\* two branches have: retire the fork, and while its worktree goes, discard
\* the source.  Both branches go.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"forked"}
    Break = "going_counts"
INVARIANT KeptButByDiscard
