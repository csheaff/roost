\* expect: OffersTold
\* Broken: a merge asks which offers its question named before Git merges,
\* and not again after.  Its agent offers a task while Git merges, without
\* the registry lock, and the offer goes with the task, which nothing named.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"offer", "offer once asked"}
    Break = "offers_named_once"
INVARIANT OffersTold
