\* expect: MadeAlone
\* Broken: the run that makes the task's worktree takes no hold of it.  A
\* discard is not refused as busy: it counts, and stops the task, with Git
\* still writing there.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 0
    MaxRequests = 1
    MaxCrashes = 0
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"unmade"}
    Break = "run_no_hold"
INVARIANT MadeAlone
