\* The code as it is, with a retarget, and a task that may be a fork, whose
\* agent does a unit of work meanwhile: so the branch it merges into may
\* have some of its commits and not others.  One request, and a crash.
\* Must pass.
SPECIFICATION Spec
CONSTANTS
    MaxWork = 1
    MaxRequests = 1
    MaxCrashes = 1
    ReplaceInWindow = FALSE
    OthersWorkInX = FALSE
    Also = {"retarget", "forked"}
    Break = "none"
INVARIANTS
    KeptButByDiscard
    OnlyItsOwn
    DiscardTold
