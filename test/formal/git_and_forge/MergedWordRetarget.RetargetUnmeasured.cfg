\* expect: temporal
\* Broken: roost-retarget asks for no measurement once its host replies.
\* The cache takes the new branch from the reply, so no poll sees it change,
\* and where the Git stamp stays, a row merged into the branch before goes
\* on saying "merged".
CONSTANTS
  MaxCommits = 1
  MaxMerges = 1
  MaxLost = 0
  MaxRetargets = 1
  LandedWithoutStats = FALSE
  StampUnwatched = FALSE
  GivesUpOwed = FALSE
  RetargetUnmeasured = TRUE
  BranchUnwatched = FALSE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
