\* expect: RetireLosesNothing
\* Broken, as LandedRetarget.StartedAtBase.cfg is.  B names what has some
\* of the task's commits, and they count from a commit of its own.  Reset
\* to where its branch was made, before that, it has no commit of its own,
\* and reads as merged: its tip is in the branch it merges into, and is
\* not where its commits count from.  Nothing is lost by retiring it; the
\* word is wrong.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = TRUE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = FALSE
  StartedAtBase = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT RetireLosesNothing
