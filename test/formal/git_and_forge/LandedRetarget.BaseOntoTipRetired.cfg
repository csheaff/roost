\* expect: RetireOnlyLanded
\* Broken twice, as LandedRetarget.BaseOntoTip.cfg is, and what else
\* follows: B names a tag at the task's tip, or a fork's branch, and the
\* task reads as one that never committed.  Its commits are on its own
\* pushed branch, or in the fork's, and merged nowhere, and x retires it.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = FALSE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = TRUE
  StartedAtBase = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT RetireOnlyLanded
INVARIANT RetireLosesNothing
INVARIANT RepliesSayTrue
INVARIANT RecordedMergesHappened
