\* expect: temporal
\* Finding, the code as it is: two measurements of a change lost in a row,
\* and Emacs stops asking.  A row says "merged" of commits the merge lacks
\* until something else changes or you press g.
CONSTANTS
  MaxCommits = 2
  MaxMerges = 1
  MaxLost = 2
  LandedWithoutStats = FALSE
  StampUnwatched = FALSE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
