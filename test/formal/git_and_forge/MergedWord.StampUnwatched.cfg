\* expect: temporal
\* Broken: roost--task-states leaves out the Git stamp, so a quiet poll
\* never sees a commit.  A row says "merged" of commits since, for good.
CONSTANTS
  MaxCommits = 2
  MaxMerges = 1
  MaxLost = 0
  LandedWithoutStats = FALSE
  StampUnwatched = TRUE
  GivesUpOwed = FALSE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
