\* expect: RetireLosesNothing
\* Finding: the code as it is, where a branch is reset.  B names what has
\* some of the task's commits, and a commit of its own is its start.  Reset
\* to where it first started, before that, the branch has no commit of its
\* own, and reads as merged: its tip is in the branch it merges into, and
\* is not its start.  Nothing is lost by retiring it; the word is wrong.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = TRUE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = FALSE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT RetireLosesNothing
