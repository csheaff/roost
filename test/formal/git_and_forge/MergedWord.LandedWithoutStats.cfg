  MaxCommits = 2
  MaxMerges = 1
  MaxLost = 0
  LandedWithoutStats = TRUE
  StampUnwatched = FALSE
  GivesUpOwed = FALSE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
