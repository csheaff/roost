\* expect: temporal
\* Broken: roost--task-states leaves out the branch the task merges into,
\* as it did.  B's reply is lost, or B was pressed in another Emacs, and the
\* two branches' reflogs have one time, or Git keeps none: no poll sees a
\* change, and a row merged into the branch before goes on saying "merged".
CONSTANTS
  MaxCommits = 1
  MaxMerges = 1
  MaxLost = 0
  MaxRetargets = 1
  LandedWithoutStats = FALSE
  StampUnwatched = FALSE
  GivesUpOwed = FALSE
  RetargetUnmeasured = FALSE
  BranchUnwatched = TRUE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
