\* expect: LandedSaysSo
\* Broken, as LandedRetarget.StartedAtBase.cfg is.  The task's first commit
\* is merged by hand, it commits again, and B names the branch that has the
\* first: its commits count from that one of its own.  Reset there, its
\* work is all merged, and it reads as a task that never committed.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = TRUE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = FALSE
  StartedAtBase = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT LandedSaysSo
