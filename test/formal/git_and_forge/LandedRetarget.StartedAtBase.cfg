\* expect: RetireOnlyLanded
\* Broken: started_at gives baseCommit, where the task's commits count
\* from, as landed and safe_to_delete went by.  B names what has some of
\* the task's commits and not all, as a tag at an earlier one or a fork's
\* branch, and they count from that commit of its own.  Reset there, it
\* reads as a task that never committed, and x retires it: its commits are
\* in that tag or branch, or on its own pushed one, and merged nowhere.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = TRUE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = FALSE
  StartedAtBase = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT RetireOnlyLanded
