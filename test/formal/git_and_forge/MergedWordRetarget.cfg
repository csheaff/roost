\* The word "merged" in Emacs where B changes the branch the task merges
\* into, once: its reply comes or is lost, and a reply to a list is lost.
CONSTANTS
  MaxCommits = 1
  MaxMerges = 1
  MaxLost = 1
  MaxRetargets = 1
  LandedWithoutStats = FALSE
  StampUnwatched = FALSE
  GivesUpOwed = FALSE
  RetargetUnmeasured = FALSE
  BranchUnwatched = FALSE
SPECIFICATION Spec
INVARIANT CleanNoOlderThanLanded
PROPERTY MergedHeals
