\* expect: LandedSaysSo
\* Broken: retarget moves baseCommit onto the branch's tip when the branch
\* it names has all of the task's commits, as it did.  A task merged there,
\* by hand or by its pull request, then reads as one that never committed,
\* and its row stops saying "merged".
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = FALSE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT LandedSaysSo
INVARIANT RetireLosesNothing
INVARIANT RetireOnlyLanded
INVARIANT RepliesSayTrue
INVARIANT RecordedMergesHappened
