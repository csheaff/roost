\* expect: LandedSaysSo
\* Broken twice, as the code was: retarget moves baseCommit onto the branch's
\* tip when the branch it names has all of the task's commits, and
\* started_at gives baseCommit.  A task merged there, by hand or by its pull
\* request, then reads as one that never committed, and its row stops
\* saying "merged".  With started_at as it is, moving baseCommit there
\* breaks no rule here: a task is not taken to have started where its
\* commits count from.
CONSTANTS
  MaxCommits = 2
  NPR = 1
  MaxRetargets = 1
  Pushes = FALSE
  Retires = TRUE
  Resets = FALSE
  HasTipReversed = FALSE
  PushMovesMerged = FALSE
  MeasureAtAskedTip = FALSE
  BaseOntoTip = TRUE
  StartedAtBase = TRUE
  RetireReadsOnce = FALSE
SPECIFICATION Spec
INVARIANT LandedSaysSo
INVARIANT RetireLosesNothing
INVARIANT RetireOnlyLanded
INVARIANT RepliesSayTrue
INVARIANT RecordedMergesHappened
