\* The code as it is: a task on a host, with workspaces, opened in one
\* frame; connections that drop and are tried again, Roost releasing the
\* terminal, the session ending, ghostel-tmux switching the controller to
\* another session, an attach that signals, and a minibuffer you open.
SPECIFICATION Spec
CONSTANTS
  Remote = TRUE
  Workspaces = TRUE
  Frames = 1
  MaxOpens = 3
  MaxOthers = 0
  MaxDrops = 2
  MaxDetaches = 1
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 1
  MaxTries = 3
  SessionCanEnd = TRUE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = FALSE
  Closes = FALSE
  FailsInARow = FALSE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
  OneController
  HandoffOutside
  OpenKeepsWindow
  KeptForItsWorkspace
  NoStrayStandIn
