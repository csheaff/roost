\* The code as it is: a task on a host, with workspaces, opened in one
\* frame; connections that drop and are tried again, also while a question
\* holds the attach hook, Roost releasing the terminal, the session ending,
\* ghostel-tmux switching the controller to another session, an attach that
\* signals, also in a row of tries, a window you give another buffer, and a
\* minibuffer you open.
SPECIFICATION Spec
CONSTANTS
  Remote = TRUE
  Workspaces = TRUE
  Frames = 1
  MaxOpens = 3
  MaxOthers = 1
  MaxDrops = 2
  MaxDetaches = 1
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 1
  MaxTries = 3
  SessionCanEnd = TRUE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = TRUE
  Closes = FALSE
  FailsInARow = TRUE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
  PanesSay = TRUE
  AttachSays = TRUE
  HiddenOnly = TRUE
  OpenKeepsHidden = TRUE
  ByStandIn = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
  OneController
  HandoffOutside
  OpenKeepsWindow
  KeptForItsWorkspace
  NoStrayStandIn
