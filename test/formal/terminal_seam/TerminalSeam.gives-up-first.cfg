\* expect: EndIsTrue
\* Broken: `roost-ghostel-tmux--attach-again` counts the tries before it
\* looks for a controller attaching.  The last try's probe fails after you
\* opened the task yourself: the stand-in says "Could not attach" while your
\* open's client is still connecting.  The tries are given up too, so that
\* client is not tried again should its connection drop: DropIsTried, left
\* out here, as TLC's workers would find either first.
