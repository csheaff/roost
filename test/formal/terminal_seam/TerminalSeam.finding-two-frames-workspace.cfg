\* expect: KeptForItsWorkspace
\* FINDING in the code as it is: the task opened in two frames while it
\* connects shows one stand-in in both.  Its pane comes while one frame is in
\* another workspace: the stand-in goes, and the task's workspace there shows
\* some other buffer when you are back.  No client ends here, which would
\* find the finding above first.  See verify-terminal-seam.
SPECIFICATION Spec
