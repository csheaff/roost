  MaxOpens = 3
  MaxOthers = 0
  MaxDrops = 0
  MaxDetaches = 0
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 0
  MaxTries = 3
  SessionCanEnd = FALSE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = FALSE
  Closes = FALSE
  FailsInARow = FALSE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
  OneController
  HandoffOutside
