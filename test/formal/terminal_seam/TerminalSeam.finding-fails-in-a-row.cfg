\* expect: EndIsTrue
\* FINDING in the code as it is: you open the task from its stand-in while a
\* host whose connection dropped is tried again, and the attach signals, as
\* TRAMP does for a host away.  The stand-in says "Could not attach", but the
\* row of tries goes on, and its probe attaches.  See verify-terminal-seam.
SPECIFICATION Spec
CONSTANTS
  Remote = TRUE
  Workspaces = TRUE
  Frames = 1
  MaxOpens = 3
  MaxOthers = 0
  MaxDrops = 2
  MaxDetaches = 1
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 1
  MaxTries = 3
  SessionCanEnd = TRUE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = FALSE
  Closes = FALSE
  FailsInARow = TRUE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
  OneController
  HandoffOutside
  OpenKeepsWindow
  KeptForItsWorkspace
  NoStrayStandIn
