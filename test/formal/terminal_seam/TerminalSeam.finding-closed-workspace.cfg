  Remote = TRUE
  Workspaces = TRUE
  Frames = 1
  MaxOpens = 3
  MaxOthers = 0
  MaxDrops = 2
  MaxDetaches = 1
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 1
  MaxTries = 3
  SessionCanEnd = TRUE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = TRUE
  Closes = TRUE
  FailsInARow = TRUE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
  PanesSay = TRUE
  AttachSays = TRUE
  HiddenOnly = TRUE
  OpenKeepsHidden = TRUE
  ByStandIn = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
