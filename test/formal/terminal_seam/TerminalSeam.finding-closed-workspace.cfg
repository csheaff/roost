\* expect: NoStrayStandIn
\* FINDING in the code as it is: with workspaces, a stand-in kept for a tab
\* or perspective you left before its pane came stays once you close that
\* workspace, though nothing will show it, until the next open sweeps it.
\* See verify-terminal-seam.
