\* expect: WordIsTrue
\* FINDING in the code as it is: ghostel-tmux holds the attach hook while a
\* minibuffer is open, and drops it when the client ends meanwhile.  The
\* session's panes came, the connection drops before you close the question:
\* `--was-attached` was never set, so the stand-in says "Could not attach"
\* and the connection is not tried again.  See verify-terminal-seam.
SPECIFICATION Spec
CONSTANTS
  Remote = TRUE
  Workspaces = TRUE
  Frames = 1
  MaxOpens = 3
  MaxOthers = 0
  MaxDrops = 2
  MaxDetaches = 1
  MaxMini = 2
  MaxSwitches = 1
  MaxErrors = 1
  MaxTries = 3
  SessionCanEnd = TRUE
  MaxCtl = 4
  MaxSi = 3
  HeldEnds = TRUE
  Closes = FALSE
  FailsInARow = FALSE
  OwnSession = TRUE
  LookFirst = TRUE
  KeepCount = TRUE
  DetachedIfAttached = TRUE
  SwitchForgets = TRUE
  ReopenKeeps = TRUE
  Deferred = TRUE
  ProbeRechecks = TRUE
  SweepKeeps = TRUE
  GiveWayKeeps = TRUE
INVARIANTS
  TypeOK
  OwnPane
  ConnectingIsTrue
  EndIsTrue
  WordIsTrue
  RetryOnlyDropped
  DropIsTried
  TriesEnd
  OneController
  HandoffOutside
  OpenKeepsWindow
  KeptForItsWorkspace
  NoStrayStandIn
