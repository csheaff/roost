\* expect: EndIsTrue
\* FINDING in the code as it is: a frame shows the task's stand-in, saying
\* "Could not attach".  You open the task in another frame: it gets a stand-in
\* of its own and attaches, and the first frame still says "Could not attach"
\* while it connects.  See verify-terminal-seam.
