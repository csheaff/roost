\* expect: OfferRowGoes
\* Broken: the draft of an offer asks for its host to be listed quietly,
\* once its task is made.  With a poll in flight that does nothing, and
\* the poll, read before the task was made, is dropped for the creation's
\* reply: the offer waits on under its task, to start again.
SPECIFICATION Spec
CONSTANTS
  Break = "QuietOfferRefresh"
  Allow = {}
  MaxAsks = 1
  MaxActs = 0
  MaxVer = 2
  MaxOver = 1
  MaxBase = 0
  MaxShown = 0
  FromOffer = {"t2"}
  ActOn = {"t1"}
  News = {"t2"}
INVARIANTS
  NoRollback
  NoOfferRollback
  OneList
  OfferRowGoes
