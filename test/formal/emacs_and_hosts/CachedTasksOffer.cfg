\* CachedTasks.tla with a task made from the first task's offer, as the
\* draft of an offer makes it: its host takes the offer as it saves the
\* task, and the draft asks for the host to be listed.  Beside two
\* refreshes of your own, and a stop, retire, inspect or take of the task
\* that offered it.  Must pass.
SPECIFICATION Spec
CONSTANTS
  Break = "none"
  Allow = {"quit", "act before create replies"}
  MaxAsks = 2
  MaxActs = 1
  MaxVer = 2
  MaxOver = 1
  MaxBase = 0
  MaxShown = 0
  FromOffer = {"t2"}
  ActOn = {"t1"}
  News = {"t2"}
INVARIANTS
  NoRollback
  NoOfferRollback
  OneList
  OfferRowGoes
