\* expect: NoShownRollback
\* FINDING in the code as it is: an agent that shows an image or a page
\* moves no updatedAt, and nothing in roost--cache-task goes by shown.at.
\* A reply read before it showed one, as one to opening the task, that
\* comes after the list that read it since takes the task back to what it
\* showed before, or to nothing: the panel no longer names the image, and
\* roost-show-image says the task has shown none, until the next list.
\* See verify-emacs-and-hosts.
