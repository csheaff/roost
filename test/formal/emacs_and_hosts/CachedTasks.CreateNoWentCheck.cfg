\* expect: NoRollback
\* Broken: create's reply, late, is cached with roost--cache-task, as before,
\* and brings back the task you finished meanwhile.
SPECIFICATION Spec
CONSTANTS
  Break = "CreateNoWentCheck"
  Allow = {"act before create replies"}
  MaxAsks = 1
  MaxActs = 1
  MaxVer = 2
  ActOn = {"t2"}
INVARIANTS
  NoRollback
