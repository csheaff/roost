\* expect: AskingShown
\* Broken on purpose: the lead's turn's end ends a subagent's request, as
\* before #239, so a subagent that asks from the background reads
\* `background`, its prompt on screen.
SPECIFICATION Spec
CONSTANTS
    Subs = {"a", "b"}
    SaysLeft = {TRUE, FALSE}
    MaxSteps = 12
    Break = "sub_ends_with_turn"
INVARIANT
    AskingShown
