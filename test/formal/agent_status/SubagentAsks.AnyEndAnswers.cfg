\* expect: AskingShown
\* Broken on purpose: claude_answers takes any SubagentStop for the end of
\* what was asked, so an agent of Claude's own that ends beside a request,
\* as the one that suggests your next prompt, reads `running`, the prompt
\* still on screen.
SPECIFICATION Spec
CONSTANTS
    Subs = {"a", "b"}
    SaysLeft = {TRUE, FALSE}
    MaxSteps = 12
    Break = "any_end_answers"
INVARIANT
    AskingShown
