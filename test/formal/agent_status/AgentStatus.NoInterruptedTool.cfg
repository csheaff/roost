\* expect: DoneShownDone
\* Broken on purpose: ClaudeAgent.observe takes a tool you stopped
\* (PostToolUseFailure with is_interrupt) for any failed tool, so Esc at a
\* command you approved reads `running`, and moves updatedAt past the
\* interrupt marker the poll would read.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    EarlyWork = {}
    Break = "interrupt_is_news"
INVARIANT
    DoneShownDone
