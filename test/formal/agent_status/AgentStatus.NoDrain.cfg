\* expect: EndsAreFinal
\* Broken on purpose: the runner records the end before finish() has the
\* queued reports recorded, and the recorder takes reports after the end.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude", "codex"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "no_drain"
INVARIANT
    EndsAreFinal
