\* expect: WorkNotWaiting
\* Finding: a relayed Claude that reports its work before its SessionStart
\* hook runs, as 2.1.303 does on a task's prompt.  The hook lands before
\* the recorder has the lock, so it counts, as `ready`, and its hookAt
\* makes older news of the reports: the task reads `ready` while Claude
\* works, until its next report.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {TRUE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = TRUE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    EarlyWork = {"claude"}
    Break = "none"
INVARIANT
    WorkNotWaiting
