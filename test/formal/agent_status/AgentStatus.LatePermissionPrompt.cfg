\* expect: DoneShownDone
\* Finding, if Claude doesn't wait for its Notification hook: a
\* permission_prompt that lands after you pressed Esc at the request
\* leaves an unrelayed Claude at its prompt reading `permission`, and
\* moves updatedAt past the interrupt marker, so the poll can't put it right.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {"permission_prompt"}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "none"
INVARIANT
    DoneShownDone
