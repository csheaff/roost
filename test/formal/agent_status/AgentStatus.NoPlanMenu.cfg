\* expect: AskingShown
\* Broken on purpose: Codex's Stop is any turn's end, as before, so a task
\* at its plan's menu reads `ready`, and a prompt sent to it is dropped
\* and implements the plan.
SPECIFICATION Spec
CONSTANTS
    Agents = {"codex"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = TRUE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "no_plan_menu"
INVARIANT
    AskingShown
