\* expect: WorkNotWaiting
\* Broken on purpose: update_hook takes a hook of any run, so one in
\* flight when you stopped the task lands in the next run.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude", "codex"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "no_run_check"
INVARIANT
    WorkNotWaiting
