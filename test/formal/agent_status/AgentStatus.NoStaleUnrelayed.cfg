\* expect: WorkNotWaiting
\* Broken: a report older than the last hook's status still makes its run
\* a relayed one, as before.  A relayed Claude that reports its work
\* before its SessionStart hook runs, as 2.1.303 does on a task's prompt,
\* has that hook land before the recorder has the lock: it counts, as
\* `ready`, its hookAt makes older news of the reports, and recording them
\* takes the status from the UserPromptSubmit that follows.  The task reads
\* `ready` while Claude works, until its next report (STATUS-13).
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {TRUE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = TRUE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    EarlyWork = {"claude"}
    Break = "stale_report_relays"
INVARIANT
    WorkNotWaiting
