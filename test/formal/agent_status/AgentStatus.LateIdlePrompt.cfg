\* expect: WorkNotWaiting
\* Finding, if Claude doesn't wait for its Notification hook: an
\* idle_prompt, a minute after a turn, that lands after your next prompt
\* shows an unrelayed Claude at work as `ready` until its next hook.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {"idle_prompt"}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "none"
INVARIANT
    WorkNotWaiting
