\* expect: DoneShownDone
\* Finding, accepted: Codex says nothing when you close its plan's menu,
\* with Esc or "No, stay in Plan mode", so a Codex at its prompt reads
\* `permission` until your next prompt.  `send` asks first, and goes
\* through when you say so; retiring and merging go ahead.
SPECIFICATION Spec
CONSTANTS
    Agents = {"codex"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = TRUE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = TRUE
    Break = "none"
INVARIANT
    DoneShownDone
