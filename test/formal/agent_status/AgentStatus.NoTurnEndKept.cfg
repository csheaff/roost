\* expect: TurnEndKept
\* Broken on purpose: beside_program_status keeps no hook's status for a
\* relayed Claude, so a report's `done` hides StopFailure.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude", "codex"}
    Modes = {TRUE, FALSE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = FALSE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    Break = "no_turn_end_kept"
INVARIANT
    TurnEndKept
