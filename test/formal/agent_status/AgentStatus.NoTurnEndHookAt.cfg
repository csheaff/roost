\* expect: TurnEndKept
\* Broken: a relayed Claude's StopFailure or Stop with background work
\* sets no hookAt, as before, so a report read before it, still waiting
\* for the lock as that hook lands, undoes it: the task reads `ready`, the
\* API error or the background work forgotten.
SPECIFICATION Spec
CONSTANTS
    Agents = {"claude"}
    Modes = {TRUE}
    MaxSteps = 10
    MaxRuns = 2
    LagPastTurnEnd = TRUE
    LateKinds = {}
    AfterFailure = {"done", "idle", "error"}
    PlanMenuCloses = FALSE
    Break = "turn_end_no_hookat"
INVARIANT
    TurnEndKept
