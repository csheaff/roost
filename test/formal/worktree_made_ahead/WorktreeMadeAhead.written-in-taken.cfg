\* expect: TakenClean
\* Broken: a take doesn't read the worktree before its branch is checked
\* out there.  Someone wrote a file in the folder under ready/, and the task
\* starts with it.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 1
    MaxListings = 0
    Weeks = FALSE
    Break = "take_unchecked"
INVARIANT TakenClean
