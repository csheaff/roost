\* expect: StartsAsAdded
\* Broken: the take's checkout runs the repository's hooks.  post-checkout
\* runs as for a switch from the commit the worktree was at, while it is
\* still locked, and not as for a new worktree.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "hook_at_checkout"
INVARIANT StartsAsAdded
