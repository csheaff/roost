\* expect: StartsAsAdded
\* Broken: a take leaves the worktree's HEAD's reflog as it was.  The task
\* starts with the commits it was moved through ahead in it, which retiring
\* and discarding would read as the task's.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "log_kept"
INVARIANT StartsAsAdded
