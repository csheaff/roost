\* expect: NothingLeft
\* Broken: a sweep keeps the first of its repository's whatever its mark
\* says.  One a run was killed making, or a take moved before it was killed,
\* is marked ready again, with no worktree there to take.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 2
    MaxMade = 1
    MaxCrashes = 1
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "keeps_unready"
INVARIANT NothingLeft
