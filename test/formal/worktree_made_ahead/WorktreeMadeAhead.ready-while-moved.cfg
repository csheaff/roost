\* expect: ReadyIsThere
\* Broken: a take holds ready/.lock, but leaves the mark saying ready until
\* Git has moved the worktree.  Killed then, it leaves a mark that calls
\* ready a worktree at a task's path.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 1
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "take_unmarked"
INVARIANT ReadyIsThere
