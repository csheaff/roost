\* expect: TakenOnce
\* Broken: a take reads the marks and moves the worktree with no hold of
\* ready/.lock, and without marking it not ready first.  Two tasks asked
\* for at once both take the one made ahead.  (Git's own refusal to move a
\* folder that has gone is then all that stops the second.)
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 2
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "take_unlocked"
INVARIANT TakenOnce
