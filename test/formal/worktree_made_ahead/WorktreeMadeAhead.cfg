\* The code as it is: two tasks asked for, with or without one made ahead
\* as they begin, two more made, a listing, two processes killed between
\* two steps, a file someone wrote in a folder under ready/, and a week
\* passing.  Must pass.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 2
    MaxMade = 3
    MaxCrashes = 2
    MaxWrites = 1
    MaxListings = 1
    Weeks = TRUE
    Break = "none"
INVARIANTS
    TakenOnce
    TakenClean
    StartsAsAdded
    NoWishLost
    NothingLeft
    ReadyIsThere
