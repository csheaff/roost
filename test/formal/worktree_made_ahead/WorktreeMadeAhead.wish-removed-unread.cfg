\* expect: NoWishLost
\* Broken: a run removes the repository's wish once it has carried one out,
\* without comparing it with the one it read.  A wish made meanwhile goes
\* with it.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 2
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "wish_removed_blind"
INVARIANT NoWishLost
