\* expect: NothingLeft
\* Broken: undo_creation has no branch for a worktree locked as TAKING.  A
\* take killed before its branch was checked out is undone as a failed
\* creation, and Git removes no locked worktree unforced: it stays, a task
\* to look at, though nothing was written there.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 1
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "undo_no_taking"
INVARIANT NothingLeft
