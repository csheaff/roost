\* expect: NoWishLost
\* Broken: a run that read no wish left ends as it lets go of
\* ready/.tending, without looking again.  A wish made between that read
\* and letting go, whose own run found this one at work, is carried out by
\* neither.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 2
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "no_look_again"
INVARIANT NoWishLost
