\* expect: StartsAsAdded
\* Broken: the task's branch is made by the checkout in the worktree taken,
\* not in the primary checkout, where git worktree add makes it and its
\* reference-transaction hooks run.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 0
    Weeks = FALSE
    Break = "branch_in_worktree"
INVARIANT StartsAsAdded
