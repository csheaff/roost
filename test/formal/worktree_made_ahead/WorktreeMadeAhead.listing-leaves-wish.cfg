\* expect: NoWishLost
\* Broken: a listing's run ends once it has removed what no task will take.
\* A wish made meanwhile, whose own run found the listing's at work, waits
\* for the next task.
SPECIFICATION Spec
CONSTANTS
    MaxCreations = 1
    MaxMade = 1
    MaxCrashes = 0
    MaxWrites = 0
    MaxListings = 1
    Weeks = TRUE
    Break = "prune_ignores_wish"
INVARIANT NoWishLost
