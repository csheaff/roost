\* The code as it is, for a draft that makes two attempts at its prompt:
\* questions left open, edits and moves back, C-c C-c cut short between
\* its two requests, and a draft changed between asks with one ID.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 2
  MaxAsks = 2
  MaxHeld = 2
  Attempts = 2
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = TRUE
  SubmitQuitsQuestion = TRUE
  EditBack = TRUE
  CutShort = TRUE
  MixedAttempts = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
