\* expect: AtMostOnce
\* Finding: at three asks, which NewTaskAttempts.cfg leaves out.  A draft
\* that makes two attempts, changed and asked again with its ID, is told
\* which attempt its host made from what it said before ("Made fix 2 from
\* what you sent before"), and forgets the ID.  Changed back, C-c C-c
\* asks under a new one: for that attempt at those words a second time,
\* and for its own task, which the request it gave up on may still make.
\* Roost named a task of the earlier C-c C-c before you asked again, and
\* this rule counts only the draft's own as said.
SPECIFICATION Spec
CONSTANTS
  NDirs = 1
  NTexts = 2
  MaxAsks = 3
  MaxHeld = 1
  Attempts = 2
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = TRUE
  SubmitQuitsQuestion = FALSE
  EditBack = TRUE
  CutShort = FALSE
  MixedAttempts = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
