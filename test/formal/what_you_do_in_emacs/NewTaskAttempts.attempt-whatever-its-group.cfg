\* expect: AttemptsAtOnePrompt
\* Broken: the host makes an attempt whatever the others of its draft's ID
\* were made from.  A draft that makes two attempts, changed after its own
\* request failed or got no reply, asks again with the same ID: one attempt
\* was made from what the draft said before, the other is made from what
\* it says now, and the draft closes as if both were attempts at that.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 2
  MaxAsks = 2
  MaxHeld = 2
  Attempts = 2
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = FALSE
  SubmitQuitsQuestion = FALSE
  EditBack = FALSE
  CutShort = FALSE
  MixedAttempts = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
