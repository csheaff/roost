\* expect: EveryAttemptMade
\* Known: a draft closes for its own task, whatever became of the other
\* attempts.  One its host refused says so in a message, and nothing asks
\* for it again, as `roost-compose-submit' says: "One of the others that
\* fails says so, and the draft goes on."
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 2
  MaxAsks = 2
  MaxHeld = 2
  Attempts = 2
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  SubmitQuitsQuestion = FALSE
  EditBack = FALSE
  CutShort = FALSE
  MixedAttempts = FALSE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
  EveryAttemptMade
