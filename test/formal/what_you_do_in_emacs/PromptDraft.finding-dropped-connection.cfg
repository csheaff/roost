\* expect: PromptOnce
\* FINDING in the code as it is: after a dropped connection the draft says
\* "Could not send", but over SSH the helper goes on; edited and sent
\* again, the first text goes twice.  See verify-what-you-do-in-emacs.
SPECIFICATION Spec
CONSTANTS
  MaxPieces = 3
  MaxAsks = 3
  MaxOthers = 1
  IdsKept = 4
  NewIdForNewText = TRUE
  CompareBeforeClose = TRUE
  WholeCheck = TRUE
  FailureClearsFlag = TRUE
  KillAfterPaste = FALSE
  Drops = TRUE
INVARIANTS
  TypeOK
  PasteOnceEachId
  PromptOnce
  NothingLost
  FlagSaysSending
