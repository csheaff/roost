\* The code as it is, for a draft that makes one task, with questions left
\* open as you press C-c C-c, and edits or moves that bring back what the
\* draft said before.  CutShort and MixedAttempts are of a draft that makes
\* several, which NewTaskAttempts.cfg checks.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 3
  MaxAsks = 3
  MaxHeld = 2
  Attempts = 1
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = TRUE
  SubmitQuitsQuestion = TRUE
  EditBack = TRUE
  CutShort = FALSE
  MixedAttempts = FALSE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
