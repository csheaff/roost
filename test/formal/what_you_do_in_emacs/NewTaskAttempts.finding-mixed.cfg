\* expect: AttemptsAtOnePrompt
\* Finding: a draft that makes two attempts, changed after its own request
\* failed or got no reply, asks again with the same ID.  Its host answers
\* each attempt with the task it has or makes it now, so one is made from
\* what the draft said before and the other from what it says now, and the
\* draft closes as if both were attempts at what it says.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 2
  MaxAsks = 2
  MaxHeld = 2
  Attempts = 2
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  SubmitQuitsQuestion = FALSE
  EditBack = FALSE
  CutShort = FALSE
  MixedAttempts = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
