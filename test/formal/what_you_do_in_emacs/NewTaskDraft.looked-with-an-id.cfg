\* expect: AtMostOnce
\* Broken: `roost--compose-looked-p` takes a draft that has asked for its
\* task for one you only looked at.  An offer's draft that got no reply,
\* asked again and quit before any request went, has no note and keeps its
\* creation ID: RET on its offer starts it anew with no ID, and C-c C-c
\* makes a second task beside the one its host made of the first request.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 3
  MaxAsks = 3
  MaxHeld = 2
  Attempts = 1
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = TRUE
  LookedHasNoId = FALSE
  SubmitQuitsQuestion = TRUE
  EditBack = TRUE
  CutShort = FALSE
  MixedAttempts = FALSE
  QuitBeforeAsking = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
