\* expect: AtMostOnce
\* The code as it is, with C-c C-c quit before any request goes.  An offer's
\* draft that got no reply keeps its creation ID; asked again and quit at
\* the question about the setup command, its note goes and the ID stays, so
\* it reads as one you only looked at: RET on the offer starts it anew with
\* no ID, and C-c C-c makes a second task beside the first request's.
SPECIFICATION Spec
CONSTANTS
  NDirs = 2
  NTexts = 3
  MaxAsks = 3
  MaxHeld = 2
  Attempts = 1
  HostLock = TRUE
  CompareBeforeClose = TRUE
  KeepIdForProject = TRUE
  FailureClearsFlag = TRUE
  KeepOwnInFlight = TRUE
  ForgetMixedFirst = TRUE
  WhatSaysAll = TRUE
  KeepAskedOnceSent = TRUE
  OfferKeepsDraft = TRUE
  GroupKeepsItsWords = TRUE
  LookedSaysNothing = TRUE
  SubmitQuitsQuestion = TRUE
  EditBack = TRUE
  CutShort = FALSE
  MixedAttempts = FALSE
  QuitBeforeAsking = TRUE
INVARIANTS
  TypeOK
  OneTaskPerId
  DraftNeverLost
  AtMostOnce
  AttemptsAtOnePrompt
  FlagSaysCreating
